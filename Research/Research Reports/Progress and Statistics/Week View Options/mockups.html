const params=new URLSearchParams(location.search),OPT=+(params.get('option')||1),MODE=params.get('mode')||'light';document.body.className=(MODE==='dark'?'dark ':'')+(MODE==='large-text'?'large':'');document.querySelector('.phone').classList.add('opt'+OPT);
const colors={orange:['#ff9500','#ff9f0a'],green:['#34c759','#30d158'],blue:['#007aff','#0a84ff'],teal:['#30b0c7','#40c8e0'],purple:['#af52de','#bf5af2'],mint:['#00c7be','#66d4cf'],cyan:['#32ade6','#64d2ff'],indigo:['#5856d6','#5e5ce6'],brown:['#a2845e','#ac8e68'],gray:['#8e8e93','#98989d']};
const sym=n=>`<img class="symbol" src="${SYMBOLS[n]}" alt="">`;document.getElementById('back').innerHTML=sym('chevron.left');document.getElementById('options').innerHTML=sym('ellipsis.circle');document.getElementById('previous').innerHTML=sym('chevron.left');document.getElementById('next').innerHTML=sym('chevron.right');
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],words={done:'Done',part:'Part done',empty:'Not done',today:'Today',later:'Later',blank:'No log',skip:'Skipped',pause:'Paused',over:'Over limit'};
function mark(s,f=.6){return `<span class="mark ${s}" aria-hidden="true">${['skip','pause','over'].includes(s)?`<img class="state-symbol" src="${SYMBOLS[{skip:'forward.fill',pause:'pause.fill',over:'arrowtriangle.up.fill'}[s]]}" alt="">`:''}${s==='part'?`<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--secondary)" stroke-width="1.5"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${f*50.265} 50.265" transform="rotate(-90 10 10)"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${f*50.265} 50.265" transform="rotate(-90 10 10)"/></svg>`:''}</span>`}
function strip(h){return `<div class="week">${h.marks.map((s,i)=>`<div class="day ${i===5?'today':''}"><span class="weekday">${days[i]}</span>${mark(s,h.fraction)}${OPT===5?`<span class="state-word">${h.run&&s==='done'?'Clean day':words[s]}</span>`:''}</div>`).join('')}</div>`}
function states(h,q=false){return `<div class="state-list">${h.marks.map((s,i)=>`<div><strong>${days[i]}</strong><span>${s==='done'?(q?'Clean day':'Done'):s==='blank'?'No log · weekly goal':s==='part'?'Part done · '+(h.name==='Read'?'12 of 20 min':'5,200 of 8,000 steps'):s==='today'?(h.name==='Coffee'?'Day still open':q?'Current day':'Not done yet'):words[s]}</span></div>`).join('')}</div>`}
function heading(h){return `<div class="heading"><div class="icon">${sym(h.symbol)}</div><div class="head-text"><div class="name">${h.name}</div>${h.goal?`<div class="goal">${h.goal}</div>`:''}</div><div class="chev">${sym('chevron.right')}</div></div>`}
function habit(h,i){return `<article class="habit" id="habit-${i}" style="--h:${colors[h.color][MODE==='dark'?1:0]}">${heading(h)}<div class="numbers"><div class="metric">${h.metric}</div>${h.context?`<div class="context">${h.context}</div>`:''}</div>${strip(h)}${h.detail?`<div class="detail">${h.detail}</div>`:''}${MODE==='large-text'?states(h):''}</article>`}
function quit(h,i){return `<article class="habit quit-row" id="quit-${i}" style="--h:${colors[h.color][MODE==='dark'?1:0]}">${heading(h)}<div class="numbers"><div class="run">${h.run}</div><div class="run-label">Current run</div><div class="context">Best ${h.best} · 0 slips this week</div></div>${strip(h)}${MODE==='large-text'?states(h,true):''}</article>`}
function rings(){return `<div class="rings">${[8/9,.9,1,1,1,5.25/9,0].map((f,i)=>`<div class="ring-cell ${i===5?'today':''}"><span class="todaylabel">${days[i]}</span><svg viewBox="0 0 42 42" class="${i===6?'future-ring':''}"><circle cx="21" cy="21" r="18" stroke="currentColor" stroke-opacity=".12" stroke-width="3" fill="none"/><circle cx="21" cy="21" r="18" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="${f*113.097} 113.097" transform="rotate(-90 21 21)"/><text x="21" y="26" text-anchor="middle" class="date">${[27,28,29,30,1,2,3][i]}</text>${f===1?'<circle cx="35" cy="6" r="6" fill="currentColor"/><path d="M32 6l2 2 3-4" fill="none" stroke="var(--card)" stroke-width="1.3"/>':''}</svg></div>`).join('')}</div>`}
function stats(){return `<div class="stats"><div><b>3</b><span>Full days</span></div><div><b>0 of 1</b><span>Weekly goals met so far</span></div></div>`}
function overview(){let hero=`<div class="eyebrow">Done so far this week</div><div class="hero">53 of 55 <small>· 96%</small></div>`;let inner=OPT===2?rings()+hero+stats():OPT===3?hero+stats()+rings():hero+rings()+stats();return `<div class="section-head">Overview <span class="info">${sym('info.circle')}</span></div><section class="overview">${inner}<div class="previous">Last week · 46 of 57</div></section>`}
function key(){return `<div class="key" id="key">${[['done','Done'],['part','Part done'],['today','Today']].map(([m,s])=>`<span class="key-item">${mark(m)}${s}</span>`).join('')}<span class="all">All day states ${sym('chevron.right')}</span></div>`}
const content=overview()+key()+`<div class="section-head">Habits <span class="sub">12</span></div>`+(OPT===3?'<div class="group-shell">':'')+HABITS.map(habit).join('')+(OPT===3?'</div>':'')+`<section class="quit-section" id="quit-section"><div class="section-head">Quitting <span class="sub">2</span></div><div class="asof">Current runs · as of 1:45 PM</div><div class="quit-key">${mark('done')} Clean day &nbsp; ${mark('empty')} Slip recorded &nbsp; ${mark('pause')} Paused</div>${OPT===3?'<div class="group-shell">':''}${QUITS.map(quit).join('')}${OPT===3?'</div>':''}</section>`;document.getElementById('content').innerHTML=content;
window.scrollToPart=(part)=>{const s=document.getElementById('scroller');s.scrollTop=part==='habits'?document.getElementById('habit-4').offsetTop-100:part==='quit'?document.getElementById('quit-section').offsetTop-120:0;};
window.legend=()=>`<div class="legend-screen"><div class="legend-title">How to read your week</div>${[['done','Done / within the limit','A goal met; limits only after the day ends.'],['part','Part done','The ring shows the share of that day’s amount.'],['empty','Not done','A planned day that has ended.'],['today','Today · still open','No final judgement yet.'],['over','Over the limit','Only shown after the day or period ends.'],['skip','Skipped','Does not count against the goal.'],['pause','Paused','Does not count against the goal.'],['later','Later','A future day.'],['blank','No log / not planned','For weekly goals, no log is neutral. Else: not its day or before the start.']].map(([m,t,d])=>`<div class="legend-item">${mark(m)}<div><b>${t}</b><p>${d}</p></div></div>`).join('')}<div class="legend-item">${mark('done')}<div><b>Quitting · clean day</b><p>A day with no recorded slip; today is as of the snapshot.</p></div></div><div class="legend-item">${mark('empty')}<div><b>Quitting · slip recorded</b><p>History stays. The empty ring is a slip, not a daily goal result.</p></div></div><p class="sub">These marks show history. Tapping a habit opens its details.</p></div>`;
