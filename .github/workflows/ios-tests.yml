# Builds the iPhone app and runs UI tests and speed tests on GitHub's Macs, so the MacBook doesn't have to.
#
# The repository is public, so Actions minutes (Mac runners included) are free and unlimited (2 Oct 2026). It still runs
# only when asked, so a push of docs doesn't tie up a Mac. One job per branch at a time, and only one waits: starting a
# third run on the same branch cancels the waiting one (GitHub concurrency groups). Runs on different branches go side
# by side:
#   - by hand: GitHub → Actions → "iOS build and tests" → Run workflow (pick the branch, tests and speed), or
#   - on a push whose commit message contains [ios-ci] (UI tests) and/or [ios-perf] (speed tests).
#     [ios-perf] runs the speed runs: the app drives itself with no XCTest attached (measure_perf_driver.sh,
#     PERFORMANCE.md rule 2); [ios-perf-input] alongside it runs only the typing scenarios. [ios-perf-xctest] runs the
#     older XCTest speed tests (measure_perf.sh), kept only for screens with no PerfDriver scenario yet (Progress,
#     Groups, Backup, Tasks, Reminders); XCTest's own screen reading inflates those numbers.
#     Other pushes skip the job and use no minutes.
#   Run workflow's "device" picks the simulator by device type ("iPhone SE (3rd generation)" for the small-screen checks,
#   SmallScreenUITests, Rulebook T15); empty uses the newest iPhone.
#
# Results for Claude (and anyone): a short summary is pushed to the `ci-results` branch after every run —
#   git fetch origin ci-results && git show origin/ci-results:latest.md
# Logs, samples and screenshots of failures are the run's `ios-results` download.
name: iOS build and tests

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "UI test classes to run, comma-separated (or 'all', or 'none')"
        default: "TodayUITests,TimerUITests,ProgressUITests,GroupsUITests,UndoUITests"
      perf:
        description: "Also run the speed tests (about 8 more minutes)"
        type: boolean
        default: false
      xctest:
        description: "Also run the older XCTest speed tests (screens with no PerfDriver scenario yet)"
        type: boolean
        default: false
      scenarios:
        description: "Speed runs: only these PerfDriver scenarios, timed and profiled (e.g. habit-page); empty for all"
        type: string
        default: ""
      device:
        description: "Simulator to test on, by device type name (e.g. 'iPhone SE (3rd generation)'); empty for the newest iPhone"
        type: string
        default: ""
  push:
    branches-ignore: [ci-results]

permissions:
  contents: write  # to push the summary to the ci-results branch
  id-token: write  # SyncUITests sign in to the dev server with this run's GitHub identity token (server: POST /v1/auth/ci)

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ios-ci]') ||
      contains(github.event.head_commit.message, '[ios-perf]') ||
      contains(github.event.head_commit.message, '[ios-perf-xctest]')
    # Here, not on the workflow: a push that runs nothing must not cancel a run that's going.
    concurrency:
      group: ios-job-${{ github.ref }}
      # A newer widget-validation push supersedes its older run on this same branch.
      cancel-in-progress: ${{ contains(github.event.head_commit.message, '[ios-widgets]') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - name: What to run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TESTS=${{ github.event.inputs.tests }}" >> "$GITHUB_ENV"
            echo "PERF=${{ github.event.inputs.perf }}" >> "$GITHUB_ENV"
            echo "PERF_XCTEST=${{ github.event.inputs.xctest }}" >> "$GITHUB_ENV"
            echo "DEVICE=${{ github.event.inputs.device }}" >> "$GITHUB_ENV"
            if [ -n "${{ github.event.inputs.scenarios }}" ]; then
              echo "PERF_SCENARIOS=${{ github.event.inputs.scenarios }}" >> "$GITHUB_ENV"
              echo "PERF_PROFILE_SCENARIOS=${{ github.event.inputs.scenarios }}" >> "$GITHUB_ENV"
            fi
          else
            case "$MESSAGE" in *"[ios-ci]"*) echo "TESTS=TodayUITests,TimerUITests,ProgressUITests,GroupsUITests,UndoUITests" >> "$GITHUB_ENV";; *) echo "TESTS=none" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-analytics]"*) echo "TESTS=AnalyticsUITests,PersistenceUITests,BackupUITests,OnboardingUITests/testWelcomeToFirstHabit,OnboardingUITests/testRestoreFromTheWelcome,OnboardingUITests/testNotNowAndHelp,WidgetUITests/testStorageActionsDayBoundariesPrivacyAndUnlimitedTasks" >> "$GITHUB_ENV"; echo "PERF_ANALYTICS=1" >> "$GITHUB_ENV"; echo "PERF_SCENARIOS=scroll-today tap-today new-habit widget-log widget-guide" >> "$GITHUB_ENV"; echo "PERF_PROFILE_SCENARIOS=scroll-today tap-today new-habit widget-log widget-guide" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-widgets]"*) echo "TESTS=WidgetUITests,WidgetSystemUITests,UndoUITests/testStoreCorrectionsRecalculateAndPersist,TimerUITests" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-widgets-recheck]"*) echo "TESTS=WidgetUITests,WidgetSystemUITests" >> "$GITHUB_ENV";; esac
            # A targeted regression pass after family screenshots already passed: real storage,
            # actual cold Home intent and existing timer UI, retaining all widget/Today timing scenarios.
            case "$MESSAGE" in *"[ios-widgets-validation]"*) echo "TESTS=WidgetUITests/testStorageActionsDayBoundariesPrivacyAndUnlimitedTasks,WidgetSystemUITests/testHomeScreenInstallTapAndColdPersistence,TimerUITests" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-widgets-build]"*) echo "TESTS=none" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-backup]"*) echo "TESTS=BackupUITests,TodayUITests,TimerUITests" >> "$GITHUB_ENV";; esac
            # Sync after changes made inside and outside the app (Current Work 67): end-to-end sync with the dev server,
            # backup, widgets and timers.
            case "$MESSAGE" in *"[ios-sync]"*) echo "TESTS=SyncUITests,BackupUITests,WidgetUITests,WidgetSystemUITests,TimerUITests" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-backup]"*) echo "PERF_TESTS=testBackupPage testMenuOpenClose testScrollToday" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-backup-ui]"*) echo "TESTS=BackupUITests" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-tasks]"*) echo "TESTS=TasksUITests,TodayUITests,ScheduleUITests/testCalendarAndPersistenceRules,ScheduleUITests/testTaskAfterCompletion" >> "$GITHUB_ENV"; echo "PERF_TESTS=testTasksPage testTaskEdit testScrollToday" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-tasks-recheck]"*) echo "TESTS=TasksUITests" >> "$GITHUB_ENV"; echo "PERF_TESTS=testTaskEdit" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-reminders]"*) echo "TESTS=RemindersUITests,TasksUITests,BackupUITests,TodayUITests,TimerUITests,ScheduleUITests/testCalendarAndPersistenceRules,ScheduleUITests/testTaskAfterCompletion" >> "$GITHUB_ENV"; echo "PERF_TESTS=testRemindersPage testTasksPage testScrollToday" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-reminders-recheck]"*) echo "TESTS=RemindersUITests,TasksUITests,BackupUITests,TodayUITests,TimerUITests" >> "$GITHUB_ENV"; echo "PERF_TESTS=testRemindersPage" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-perf-xctest]"*|*"[ios-backup]"*|*"[ios-tasks"*|*"[ios-reminders"*) echo "PERF_XCTEST=true" >> "$GITHUB_ENV";; esac
            # Foundation/Release correctness changes reuse prior unchanged-view UI/performance evidence.
            case "$MESSAGE" in *"[ios-contract-only]"*) echo "TESTS=none" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-perf]"*) echo "PERF=true" >> "$GITHUB_ENV";; *) echo "PERF=false" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-widgets]"*) echo "PERF_SCENARIOS=scroll-today tap-today widget-log widget-guide" >> "$GITHUB_ENV"; echo "PERF_PROFILE_SCENARIOS=scroll-today tap-today widget-log widget-guide" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-widgets-recheck]"*) echo "PERF_SCENARIOS=widget-log widget-guide" >> "$GITHUB_ENV"; echo "PERF_PROFILE_SCENARIOS=widget-log widget-guide" >> "$GITHUB_ENV";; esac
            case "$MESSAGE" in *"[ios-perf-input]"*) echo "PERF_SCENARIOS=new-habit day-sheet log-sheet add-screens notes" >> "$GITHUB_ENV";; esac
          fi

      - name: Native analytics contract and outgoing payload checks
        id: analytics
        if: contains(env.MESSAGE, '[ios-analytics]') || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          mkdir -p Research/Temp/analytics
          iOS/Tools/analytics/run_contract_tests.sh 2>&1 | tee Research/Temp/analytics/contract.log

      - name: Explicit content-free EU provider integration smoke
        id: provider
        if: contains(env.MESSAGE, '[ios-analytics]') && !contains(env.MESSAGE, '[ios-contract-only]')
        continue-on-error: true # Provider access never blocks durable app/native validation.
        run: |
          set -o pipefail
          iOS/Tools/analytics/run_provider_smoke.sh 2>&1 | tee Research/Temp/analytics/provider.log

      # The speed rules that can be read from the code (iOS/PERFORMANCE.md). Fails the run before any Mac time goes
      # to building.
      - name: Speed rules
        run: |
          iOS/Tools/perf/check_rules.sh
          python3 iOS/Tools/ci/verify_widget_evidence.py

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The Kotlin core (Core/) is built by a build phase with Gradle 9, which needs Java 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('Core/**/*.kts', 'Core/gradle/wrapper/gradle-wrapper.properties') }}-apple-release
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('Core/**/*.kts', 'Core/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Core storage and migration tests
        id: core
        working-directory: Core
        run: ./gradlew jvmTest

      - name: Build
        id: build
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Habits.xcodeproj -scheme Habits \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" 2>&1 | tee build.log | grep -E "error:|warning: .*Habits/|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build Release with production gate closed
        id: releasebuild
        if: contains(env.MESSAGE, '[ios-analytics]') || github.event_name == 'workflow_dispatch'
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild build -project Habits.xcodeproj -scheme Habits -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" 2>&1 | tee release-build.log | grep -E "error:|warning: .*Habits/|BUILD" || true
          grep -q "BUILD SUCCEEDED" release-build.log

      - name: Save available core build dependencies
        if: always() && steps.core.outcome == 'success' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('Core/**/*.kts', 'Core/gradle/wrapper/gradle-wrapper.properties') }}-apple-release

      - name: Pick a simulator
        if: steps.build.outcome == 'success' && !contains(env.MESSAGE, '[ios-contract-only]')
        timeout-minutes: 8
        run: |
          set -o pipefail
          {
            sudo xcodebuild -runFirstLaunch
            xcodebuild -version
            xcrun simctl list runtimes
            # A Simulator.app launch can boot its remembered device as well as our selected one.
            # Use one clean headless device to avoid parallel migration and stale image data.
            xcrun simctl shutdown all || true
            ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
            # A chosen device type (the iPhone SE checks, 7 Oct 2026): made fresh on the newest iOS runtime.
            if [ -n "${DEVICE:-}" ]; then
              RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS']; print(r[-1]['identifier'])")
              TYPE=$(xcrun simctl list devicetypes -j | DEVICE="$DEVICE" python3 -c "import json,sys,os; print(next(t['identifier'] for t in json.load(sys.stdin)['devicetypes'] if t['name']==os.environ['DEVICE']))")
              ID=$(xcrun simctl create "Test device" "$TYPE" "$RUNTIME")
              echo "Created $DEVICE ($TYPE) on $RUNTIME: $ID"
            fi
            echo "SIM=$ID" >> "$GITHUB_ENV"
            xcrun simctl erase "$ID"
            xcrun simctl boot "$ID" || true
            xcrun simctl bootstatus "$ID" -b
            # The first keyboard on a fresh simulator shows an animated "slide to type" tip; while it plays, UI queries
            # time out (HabitPageUITests, 3 Oct 2026). Mark it as seen, as a person who has used the keyboard has.
            xcrun simctl spawn "$ID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
            xcrun simctl spawn "$ID" defaults write com.apple.keyboard.preferences KeyboardDidShowProductivityTutorial -bool true || true
            xcrun simctl list devices booted
            xcodebuild -showdestinations -sdk iphonesimulator -project iOS/Habits.xcodeproj -scheme Habits 2>&1 | tee iOS/simulator-destinations.log
          } 2>&1 | tee iOS/simulator-startup.log

      - name: UI tests
        id: tests
        if: env.TESTS != 'none' && steps.build.outcome == 'success'
        working-directory: iOS
        run: |
          set -o pipefail
          ONLY=""
          if [ "$TESTS" = "all" ]; then
            ONLY=""
          else
            for t in ${TESTS//,/ }; do ONLY="$ONLY -only-testing:HabitsUITests/$t"; done
          fi
          # Lets SyncUITests ask GitHub for this run's identity token (TEST_RUNNER_ variables reach the test runner).
          export TEST_RUNNER_ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          export TEST_RUNNER_ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          xcodebuild test-without-building -project Habits.xcodeproj -scheme Habits \
            -sdk iphonesimulator -destination "id=$SIM" -derivedDataPath DerivedData -resultBundlePath Results.xcresult $ONLY \
            2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|Executed" || true
          grep -q "TEST EXECUTE SUCCEEDED" test.log

      # The app's own launch timings (`LaunchLog`, Current Work 11): if it stops answering after a launch, this names the
      # step. Only the app's "launch" category, so it stays small.
      - name: Save the app's launch log
        if: always() && env.TESTS != 'none' && env.SIM != ''
        run: |
          xcrun simctl spawn "$SIM" log show --style compact --info --debug --last 3h \
            --predicate 'subsystem == "com.oftenenough.app" AND category == "launch"' > iOS/app.log 2>&1 || true
          echo "Slow launch steps:"; grep -c "SLOW" iOS/app.log || true

      - name: Same-build consent-off performance baseline
        id: perfbaseline
        if: ${{ !cancelled() && env.PERF == 'true' && contains(env.MESSAGE, '[ios-analytics]') && steps.build.outcome == 'success' }}
        working-directory: iOS
        run: PERF_ANALYTICS=0 PERF_PROFILE_SCENARIOS=none Tools/perf/measure_perf_driver.sh "$SIM" perf-baseline

      - name: Speed tests
        id: perf
        if: ${{ !cancelled() && env.PERF == 'true' && steps.build.outcome == 'success' }}
        working-directory: iOS
        run: Tools/perf/measure_perf_driver.sh "$SIM" perf

      # The older XCTest speed tests, for screens with no PerfDriver scenario yet; XCTest inflates their numbers.
      - name: Speed tests through XCTest
        id: perfxctest
        if: ${{ !cancelled() && env.PERF_XCTEST == 'true' && steps.build.outcome == 'success' }}
        working-directory: iOS
        run: Tools/perf/measure_perf.sh "$SIM" perf-xctest

      - name: Export screenshots
        if: always() && steps.build.outcome == 'success'
        working-directory: iOS
        run: |
          if [ -d Results.xcresult ]; then
            xcrun xcresulttool export attachments --path Results.xcresult --output-path screenshots || true
          fi
          # Screen recordings make a single artifact too large to inspect from the cloud.
          # Keep PNGs and text/JSON diagnostics separately; recordings remain in the full result bundle.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path('screenshots').rglob('*'):
              if source.is_file() and source.suffix.lower() in {'.png', '.jpg', '.jpeg', '.txt', '.json'}:
                  target = Path('widget-images') / source.relative_to('screenshots')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY

      - name: Write the summary
        if: always()
        working-directory: iOS
        run: |
          {
            echo "# ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit: $(git log -1 --format=%s)"
            echo
            echo "- Core storage and migrations: ${{ steps.core.outcome }}"
            echo "- Build: ${{ steps.build.outcome }}"
            echo "- Release build: ${{ steps.releasebuild.outcome }}"
            echo "- Same-build speed baseline: ${{ steps.perfbaseline.outcome }}"
            echo "- UI tests ($TESTS): ${{ steps.tests.outcome }}"
            echo "- Speed tests: ${{ steps.perf.outcome }}"
            echo "- Speed tests through XCTest: ${{ steps.perfxctest.outcome }}"
            if [ -f build.log ] && ! grep -q "BUILD SUCCEEDED" build.log; then
              echo; echo "## Build errors"; echo '```'; grep -E "error:" build.log | sort -u | head -30; echo '```'
            fi
            if [ -f test.log ]; then
              echo; echo "## UI tests"; echo '```'
              grep -E "Test Case .*(passed|failed)|: error:|Executed [0-9]+ tests" test.log | sed 's/^.*Test Case/Test Case/' | sort -u | head -60
              echo '```'
            fi
            # A test that loses the app only says "Lost connection"; the crash report says why.
            if [ -f release-build.log ]; then
              echo; echo "## Release build"; echo '```'
              grep -E "error:|BUILD (SUCCEEDED|FAILED)" release-build.log | head -30
              echo '```'
            fi
            CRASHES=$(python3 Tools/ci/crash_summary.py build.log Habits 2>&1 || true)
            if [ -n "$CRASHES" ]; then
              echo; echo "## App crashes"; echo '```'; echo "$CRASHES" | head -120; echo '```'
            fi
            if [ -f perf-baseline/perf-summary.md ]; then
              echo; echo "## Speed baseline (same build, consent off; no profiler)"; echo
              cat perf-baseline/perf-summary.md
            fi
            if [ -f perf/perf-summary.md ]; then
              echo; echo "## Speed (the app drives itself, no XCTest attached; compare runs, not absolute numbers)"; echo
              cat perf/perf-summary.md
            fi
            if [ -f perf-xctest/perf-summary.md ]; then
              echo; echo "## Speed through XCTest (screens with no PerfDriver scenario yet; XCTest's work inflates these)"; echo
              cat perf-xctest/perf-summary.md
            fi
            if [ -f ../Research/Temp/analytics/provider.log ]; then
              echo
              echo '## Explicit provider smoke (synthetic development records)'
              echo '```'
              tail -30 ../Research/Temp/analytics/provider.log
              echo '```'
            fi
            if [ -f ../Research/Temp/analytics/contract.log ]; then
              echo
              echo '## Native analytics checks'
              echo '```'
              tail -100 ../Research/Temp/analytics/contract.log
              echo '```'
            fi
          } > summary.md
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push the summary to ci-results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="$RUNNER_TEMP/ci-results"; mkdir -p "$DIR"; cd "$DIR"
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-results; then git checkout -q -b ci-results FETCH_HEAD; else git checkout -q --orphan ci-results; fi
          mkdir -p runs schemas
          cp "$GITHUB_WORKSPACE/Core/schemas/app.habits.core.HabitDatabase/6.json" schemas/6.json 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/iOS/summary.md" latest.md
          cp latest.md "runs/$(date -u +%Y-%m-%d-%H%M)-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}.md"
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Results for ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})"
          git push -q origin ci-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: iOS/widget-images
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            Core/schemas
            Core/build/reports/tests
            iOS/build.log
            iOS/release-build.log
            iOS/simulator-destinations.log
            iOS/simulator-startup.log
            iOS/test.log
            iOS/summary.md
            iOS/perf
            iOS/perf-baseline
            iOS/perf-xctest
            iOS/screenshots
            iOS/Results.xcresult
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            iOS/build.log
            iOS/release-build.log
            iOS/simulator-destinations.log
            iOS/test.log
            iOS/app.log
            iOS/summary.md
            iOS/perf/*.log
            iOS/perf/*.txt
            iOS/perf/perf-summary.md
            iOS/perf-xctest/*.log
            iOS/perf-xctest/perf-summary.md
      # Small enough to inspect through the connector; xcresult remains in the full artifact above.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-review
          path: |
            iOS/summary.md
            iOS/test.log
            iOS/perf
            iOS/perf-baseline
            iOS/perf-xctest
            iOS/screenshots
          retention-days: 7
