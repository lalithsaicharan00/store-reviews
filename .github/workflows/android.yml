# The Android app (Android/, Current Work 107) on GitHub's Linux machines (minutes are free; the repository is public).
#
#   - Every push that changes Android/ or the core's build files: build, lint and unit tests (no trigger tag needed:
#     this workflow has its own queue per branch and never touches the iOS job's, Rulebook T10).
#   - [android-ci] in the head commit's message, or by hand: also the instrumented tests (Compose UI, data, widgets) on
#     an emulator. [android-perf], or by hand with perf: the Macrobenchmarks and JankStats runs.
# Tags go only on a commit meant to start those runs (T10). A run stays under 60 minutes (T1).
name: Android

on:
  push:
    branches-ignore: [ci-results]
    paths:
      - "Android/**"
      - "Core/build.gradle.kts"
      - "Core/*/build.gradle.kts"
      - "Core/src/androidMain/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Run the instrumented tests on an emulator"
        type: boolean
        default: true
      classes:
        description: "Instrumented test classes (comma-separated, e.g. com.oftenenough.app.TodayTest); empty for all"
        default: ""
      perf:
        description: "Run the Macrobenchmarks"
        type: boolean
        default: false
      api:
        description: "Emulator API level"
        default: "35"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Sign in with Google (Plus & Account): the Web OAuth client ID, a repository variable (public, not a secret: Google
# puts it in every copy of the app). Without it the build uses the stand-in sign-in.
env:
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('Android/**/*.kts', 'Core/**/*.kts', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-
      - name: Debug key (from secrets, never the repository, D11)
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/debug.keystore"; echo "ANDROID_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"; fi
      - name: Debug key fingerprint (for the Google OAuth client; the fingerprint is public, the key is not)
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$ANDROID_DEBUG_KEYSTORE" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true
      - name: Build, unit tests and lint
        working-directory: Android
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Errors
        if: failure()
        working-directory: Android
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|Could not|> " build.log | grep -v "^> Task" | head -150 || true
          shopt -s nullglob; for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -h -A5 '<failure' "$f" | head -40; done
      - name: Lint summary
        if: always()
        working-directory: Android
        run: grep -o 'Lint found [^.]*' build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug
          path: |
            Android/app/build/outputs/apk/debug/*.apk
            Android/app/build/reports/lint-results-debug.html
            Android/app/build/reports/tests/
          retention-days: 7

  instrumented:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.instrumented == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[android-ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('Android/**/*.kts', 'Core/**/*.kts', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs
        working-directory: Android
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: Android
          script: >-
            ./gradlew --console=plain :app:connectedDebugAndroidTest
            ${{ github.event.inputs.classes != '' && format('-Pandroid.testInstrumentationRunnerArguments.class={0}', github.event.inputs.classes) || '' }}
            > connected.log 2>&1; s=$?; tail -n 150 connected.log; exit $s
      - name: Failures
        if: failure()
        working-directory: Android
        run: |
          grep -E "FAILED|AssertionError|Exception|^e: " connected.log | head -80 || true
          shopt -s nullglob; for f in app/build/outputs/androidTest-results/connected/**/*.xml app/build/outputs/androidTest-results/connected/*.xml; do grep -h -A6 '<failure' "$f" | head -60; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented
          path: |
            Android/app/build/reports/androidTests/
            Android/app/build/outputs/androidTest-results/
          retention-days: 7
