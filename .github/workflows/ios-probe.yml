name: iOS design probe
on:
  push:
    branches: [claude/nice-hopper-dhgw5r-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Project
        run: |
          brew install xcodegen >/dev/null
          cd Probe && xcodegen
      - name: Simulator
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name']=='iPhone 17']
          c.sort(key=lambda t:t[0]); print(c[-1][1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Shots
        run: |
          cd Probe
          set -o pipefail
          xcodebuild test -project Probe.xcodeproj -scheme Probe -destination "id=$UDID" -resultBundlePath ../R.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|warning: unable|Test Case|failed|passed|\*\*" | head -200 || true
      - name: Export
        if: always()
        run: |
          mkdir -p raw shots
          xcrun xcresulttool export attachments --path R.xcresult --output-path raw || true
          python3 - <<'PY'
          import json, os, shutil
          m = json.load(open('raw/manifest.json')) if os.path.exists('raw/manifest.json') else []
          for t in m:
              for a in t.get('attachments', []):
                  n = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  n = n.split('_0_')[0] if '_0_' in n else n
                  if not n.endswith('.png'): n = os.path.splitext(n)[0] + '.png'
                  shutil.copy(os.path.join('raw', a['exportedFileName']), os.path.join('shots', n))
          print(sorted(os.listdir('shots')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
