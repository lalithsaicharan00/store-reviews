org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Kotlin/Native's collector marks with the app's threads stopped by default; the shared rules keep every log in Kotlin, so
# a stop-the-world mark grows with the history (Current Work 92). Concurrent marking keeps the pauses short.
kotlin.native.binary.gc=cms
